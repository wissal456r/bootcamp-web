<!doctype html><button id="load">Load countries</button><table><thead><tr><th>Country-code</th><th>Name</th></tr></thead><tbody></tbody></table><script>load.onclick=()=>fetch("../../countries.json").then(r=>r.json()).then(a=>{let b=document.querySelector("tbody");b.innerHTML="";a.forEach(x=>{let tr=document.createElement("tr");Object.values(x).slice(0,2).forEach(v=>{let td=document.createElement("td");td.textContent=v;tr.append(td)});b.append(tr)})});</script>
