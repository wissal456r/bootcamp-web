<main>
    <h2>Welcome to CodingPedia</h2>
    <p>This website is about programming.</p>

    <h2>Contact form</h2>

    <form>
        <label for="first-name">First name:</label>
        <input type="text" id="first-name" name="first-name" required>
        <br><br>

        <label for="last-name">Last name:</label>
        <input type="text" id="last-name" name="last-name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="3" max="99" required>
        <br><br>

        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone" minlength="10" maxlength="10" required>
        <br><br>

        <label>Sex:</label>
        <input type="radio" id="male" name="sex" value="male" checked>
        <label for="male">Male</label>

        <input type="radio" id="female" name="sex" value="female">
        <label for="female">Female</label>
        <br><br>

        <label for="hair-color">Hair color:</label>
        <input type="color" id="hair-color" name="hair-color">
        <br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>
        <br><br>

        <label for="technology">Technology:</label>
        <select id="technology" name="technology">
            <option value="php">PHP</option>
            <option value="sql">SQL</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
        </select>
        <br><br>

        <label for="question">Your question:</label>
        <textarea id="question" name="question" required></textarea>
        <br><br>

        <button type="submit">Submit</button>
    </form>
</main>
